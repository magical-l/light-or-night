<!DOCTYPE html>
<!-- Light or Night / 颠倒黑白 — 派生自 "Don't! Paint it black" by Marcin Kleczek <marcin.kleczek@gmail.com>，MIT License -->
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #fdf6e3;
      color: #586e75;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 15px; font-weight: 700; color: #073642; line-height: 1.2; }

    /* Status badge — describes the page only */
    .status { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
    .status.dark { background: #073642; color: #eee8d5; }
    .status.light { background: #eee8d5; color: #93a1a1; }

    /* Applied-method — supplementary info sitting right after the "Flip mode" title */
    .applied-method { font-size: 11px; color: #93a1a1; }

    /* Flip-mode settings — sits right under the badge, no divider in between */
    .settings { margin-top: 0; }
    .settings-group + .settings-group { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee8d5; }
    .settings-title { font-size: 12px; font-weight: 600; color: #073642; margin-bottom: 6px; }
    .settings-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .settings-head .settings-title { margin-bottom: 0; }

    .radio-list { display: flex; flex-direction: column; gap: 4px; }
    .radio-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border: 2px solid #eee8d5; border-radius: 6px;
      background: #fdf6e3; cursor: pointer; font-size: 12px; color: #586e75;
      transition: border-color 0.1s, background 0.1s;
    }
    .radio-row:hover { border-color: #93a1a1; }
    .radio-row.checked { border-color: #268bd2; background: #eee8d5; }
    .radio-row input { flex: 0 0 auto; margin: 0; accent-color: #268bd2; }
    .radio-row.disabled { opacity: 0.45; cursor: default; }
    .radio-row.disabled:hover { border-color: #eee8d5; }

    /* Level switch — a group is on/off from its title row */
    .switch {
      flex: 0 0 auto; margin-left: auto; position: relative;
      width: 34px; height: 18px; padding: 0; border: none; border-radius: 9px;
      background: #93a1a1; cursor: pointer; transition: background 0.15s;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%; background: #fdf6e3;
      transition: transform 0.15s;
    }
    .switch.on { background: #268bd2; }
    .switch.on::after { transform: translateX(16px); }

    /* 站点名与「当前站点」标题、开关同排；占满中间并靠左，过长时省略 */
    .site-host {
      flex: 1 1 auto; min-width: 0;
      font-size: 11px; color: #93a1a1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .info { margin-top: 10px; font-size: 11px; color: #93a1a1; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="extName">Light or Night</h1>
  </div>

  <div id="statusBadge" class="status light" data-i18n="checking">Checking...</div>

  <div id="modeSettings" class="settings" style="display:none">
    <div class="settings-group">
      <div class="settings-head">
        <div class="settings-title" data-i18n="levelGlobal">Global</div>
        <div id="appliedMethod" class="applied-method" style="display:none"></div>
        <button id="globalSwitch" class="switch" type="button"></button>
      </div>
      <div id="globalOptions">
        <div id="globalMethods" class="radio-list">
          <label class="radio-row" data-value="filter"><input type="radio" name="globalMethod" value="filter"><span data-i18n="methodFilter"></span></label>
          <label class="radio-row" data-value="remap"><input type="radio" name="globalMethod" value="remap"><span data-i18n="methodRemap"></span></label>
        </div>
        <label class="radio-row" id="globalPreferNativeRow"><input type="checkbox" id="globalPreferNative"><span data-i18n="preferNative"></span></label>
      </div>
    </div>

    <div id="siteSettings" class="settings-group" style="display:none">
      <div class="settings-head">
        <div class="settings-title" data-i18n="levelSite">This site</div>
        <div id="siteHost" class="site-host"></div>
        <button id="siteSwitch" class="switch" type="button"></button>
      </div>
      <div id="siteOptions">
        <div id="siteMethods" class="radio-list">
          <label class="radio-row" data-value="follow"><input type="radio" name="siteMethod" value="follow"><span data-i18n="followGlobal"></span></label>
          <label class="radio-row" data-value="filter"><input type="radio" name="siteMethod" value="filter"><span data-i18n="methodFilter"></span></label>
          <label class="radio-row" data-value="remap"><input type="radio" name="siteMethod" value="remap"><span data-i18n="methodRemap"></span></label>
        </div>
        <label class="radio-row" id="sitePreferNativeRow"><input type="checkbox" id="sitePreferNative"><span data-i18n="preferNative"></span></label>
      </div>
    </div>
  </div>

  <div id="info" class="info"></div>

  <script src="model.js"></script>
  <script src="popup.js"></script>
</body>
</html>
