<!DOCTYPE html>
<!-- Light or Night / 颠倒黑白 — 派生自 "Don't! Paint it black" by Marcin Kleczek <marcin.kleczek@gmail.com>，MIT License -->
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #fdf6e3;
      color: #586e75;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .header img { width: 24px; height: 24px; }
    .header h1 { font-size: 15px; font-weight: 700; color: #073642; line-height: 1.2; }

    /* Status badge — describes the page only */
    .status { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
    .status.dark { background: #073642; color: #eee8d5; }
    .status.light { background: #eee8d5; color: #93a1a1; }

    /* Applied-method — supplementary info sitting right after the "Flip mode" title */
    .applied-method { font-size: 11px; color: #93a1a1; }

    /* Flip-mode settings — sits right under the badge, no divider in between */
    .settings { margin-top: 0; }
    .settings-group + .settings-group { margin-top: 12px; }
    .settings-title { font-size: 12px; font-weight: 600; color: #073642; margin-bottom: 6px; }
    .settings-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .settings-head .settings-title { margin-bottom: 0; }

    .radio-list { display: flex; flex-direction: column; gap: 4px; }
    .radio-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border: 2px solid #eee8d5; border-radius: 6px;
      background: #fdf6e3; cursor: pointer; font-size: 12px; color: #586e75;
      transition: border-color 0.1s, background 0.1s;
    }
    .radio-row:hover { border-color: #93a1a1; }
    .radio-row.checked { border-color: #268bd2; background: #eee8d5; }
    .radio-row input { flex: 0 0 auto; margin: 0; accent-color: #268bd2; }

    .site-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .site-summary-text { flex: 1 1 auto; min-width: 0; }
    .site-source-line {
      font-size: 12px; font-weight: 600; color: #586e75;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .site-host {
      font-size: 11px; color: #93a1a1; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #siteModes { margin-top: 8px; }
    .change-btn {
      flex: 0 0 auto; padding: 3px 10px; border: 1px solid #93a1a1; border-radius: 8px;
      background: #eee8d5; color: #586e75; font-size: 11px;
      font-family: inherit; cursor: pointer;
    }
    .change-btn:hover { background: #93a1a1; color: #fdf6e3; }

    /* Divider lives below the settings block, not between badge and settings */
    .settings-divider { border-top: 1px solid #eee8d5; margin-top: 12px; }

    /* Action button */
    .btn {
      display: block; width: 100%; padding: 10px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.3px;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn-remove { background: #dc322f; color: #fdf6e3; }

    /* Validation */
    .validation { margin-top: 12px; }
    .validation h4 { font-size: 12px; color: #073642; margin-bottom: 6px; font-weight: 600; }
    .val-summary { font-size: 12px; margin-bottom: 6px; }
    .val-ok { color: #859900; font-weight: 600; }
    .val-warn { color: #b58900; }
    .val-crit { color: #dc322f; }
    .val-list { max-height: 150px; overflow-y: auto; font-size: 11px; line-height: 1.4; }
    .val-item { padding: 3px 0; border-bottom: 1px solid #eee8d5; }
    .val-item:last-child { border-bottom: none; }
    .val-ratio { font-weight: 600; }
    .val-text { color: #93a1a1; font-style: italic; }
    .val-colors { font-family: monospace; font-size: 10px; }

    .info { margin-top: 10px; font-size: 11px; color: #93a1a1; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="extName">Light or Night</h1>
  </div>

  <div id="statusBadge" class="status light" data-i18n="checking">Checking...</div>

  <div id="modeSettings" class="settings" style="display:none">
    <div class="settings-group">
      <div class="settings-head">
        <div class="settings-title" data-i18n="flipModeTitle">Flip mode</div>
        <div id="appliedMethod" class="applied-method" style="display:none"></div>
      </div>
      <div id="globalModes" class="radio-list">
        <label class="radio-row" data-value="off"><input type="radio" name="globalMode" value="off"><span data-i18n="modeOff">Off</span></label>
        <label class="radio-row" data-value="native"><input type="radio" name="globalMode" value="native"><span data-i18n="modeNativeOnly">Native only</span></label>
        <label class="radio-row" data-value="filter"><input type="radio" name="globalMode" value="filter"><span data-i18n="modeFilterOnly">Quick filter only</span></label>
        <label class="radio-row" data-value="remap"><input type="radio" name="globalMode" value="remap"><span data-i18n="modeRemapOnly">Color remap only</span></label>
        <label class="radio-row" data-value="native-filter"><input type="radio" name="globalMode" value="native-filter"><span data-i18n="modeNativeFilter">Native first, else quick filter</span></label>
        <label class="radio-row" data-value="native-remap"><input type="radio" name="globalMode" value="native-remap"><span data-i18n="modeNativeRemap">Native first, else color remap</span></label>
      </div>
    </div>

    <div id="siteSettings" class="settings-group" style="display:none">
      <div class="settings-title" data-i18n="siteModeTitle">This site</div>
      <div id="siteSummary" class="site-summary">
        <div class="site-summary-text">
          <div id="siteCurrentLine" class="site-source-line"></div>
          <div id="siteHost" class="site-host"></div>
        </div>
        <button id="siteExpandBtn" class="change-btn" type="button" data-i18n="change">Change</button>
      </div>
      <div id="siteModes" class="radio-list" style="display:none">
        <label class="radio-row" data-value="follow-global"><input type="radio" name="siteMode" value="follow-global"><span data-i18n="followGlobal">Follow global</span></label>
        <label class="radio-row" data-value="off"><input type="radio" name="siteMode" value="off"><span data-i18n="modeOff">Off</span></label>
        <label class="radio-row" data-value="native"><input type="radio" name="siteMode" value="native"><span data-i18n="modeNativeOnly">Native only</span></label>
        <label class="radio-row" data-value="filter"><input type="radio" name="siteMode" value="filter"><span data-i18n="modeFilterOnly">Quick filter only</span></label>
        <label class="radio-row" data-value="remap"><input type="radio" name="siteMode" value="remap"><span data-i18n="modeRemapOnly">Color remap only</span></label>
        <label class="radio-row" data-value="native-filter"><input type="radio" name="siteMode" value="native-filter"><span data-i18n="modeNativeFilter">Native first, else quick filter</span></label>
        <label class="radio-row" data-value="native-remap"><input type="radio" name="siteMode" value="native-remap"><span data-i18n="modeNativeRemap">Native first, else color remap</span></label>
      </div>
    </div>
  </div>

  <div id="settingsDivider" class="settings-divider" style="display:none"></div>

  <button id="actionBtn" class="btn btn-remove" style="display:none" data-i18n="actionRemoveSite">Undo, and stop flipping this site</button>

  <div id="validation" class="validation" style="display:none">
    <h4 data-i18n="validationTitle">Contrast Validation</h4>
    <div id="valSummary" class="val-summary"></div>
    <div id="valList" class="val-list"></div>
  </div>

  <div id="info" class="info"></div>

  <script src="popup.js"></script>
</body>
</html>
