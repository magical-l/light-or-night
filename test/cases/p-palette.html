<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>颠倒黑白 缺陷复现</title>
	<script>
		/* 本页只对应一个 case。 */
		var LON_CASE = 'p-palette';

		/* 尽早执行（先于扩展 content script 的 document_idle）：清掉本 origin 上残留的主题键，
		   避免跨 case 互相污染。本 case 的初始状态完全由 CSS 表达，脚本只做清理。 */
		(function () {
			var LS_KEYS = ['theme', 'color-theme', 'colorMode', 'color-mode', 'darkMode', 'dark-mode',
				'data-theme', 'night-mode', 'appearance', 'colorScheme', 'color-scheme'];
			try { for (var i = 0; i < LS_KEYS.length; i++) localStorage.removeItem(LS_KEYS[i]); } catch (e) {}
		})();
	</script>
	<style>
		*, *::before, *::after { box-sizing: border-box; }

		html {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
			background: var(--page-bg, var(--bg, #ffffff));
		}
		body {
			margin: 0;
			padding: 0 0 80px;
			min-height: 100vh;
			line-height: 1.65;
			background: var(--page-bg, var(--bg, #ffffff));
			color: var(--page-fg, var(--fg, #000000));
		}
		.wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
		h1 { font-size: 22px; margin: 0 0 8px; }
		h2 { font-size: 17px; margin: 28px 0 10px; }
		.card {
			background: var(--card-bg, #ffffff);
			color: var(--card-fg, inherit);
			border: 1px solid var(--card-bd, #ddd);
			border-radius: 10px;
			padding: 18px 20px;
			margin: 14px 0;
		}
		.card p { margin: 0 0 10px; }
		.card p:last-child { margin-bottom: 0; }
		.card code {
			font-family: "SF Mono", Consolas, monospace;
			font-size: 12.5px;
			padding: 1px 5px;
			border-radius: 4px;
			background: rgba(127,127,127,.18);
		}
		.demo {
			border: 2px dashed rgba(127,127,127,.5);
			border-radius: 8px;
			padding: 14px 16px;
			margin-top: 6px;
		}
		.legend { font-size: 12px; opacity: .75; margin-top: 4px; }

		/* ============ 本 case 的主题 CSS：一页深色，且没有任何可切的原生主题
		     （无 class / data 属性 / localStorage 键），逼扩展只能走 remap。
		     底色 #0b0b12 与 tailwind slate 系都不一样，方便看「中性深底 → 奶油底」。 ============ */
		html { background: #0b0b12; --page-bg: #0b0b12; --page-fg: #e8e8f0; --card-bg: #14142a; --card-fg: #e8e8f0; --card-bd: #2a2a44; }

		/* ---------- 色块网格（本 case 的主要观察对象） ---------- */
		.group { margin-top: 22px; }
		.group > h3 { font-size: 15px; margin: 0 0 2px; }
		.group > .legend { margin: 0 0 10px; }
		.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 12px; }
		.sw-box {
			height: 64px;
			border-radius: 8px;
			/* 描边只是为了标出色块的边界：中性深底会被重映射成和本页底色一样的奶油色，
			   没有边就分不清「这块变成透明了」还是「这块不见了」。 */
			border: 1px solid rgba(255,255,255,.25);
			padding: 6px 9px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 2px;
			font-size: 13px;
			font-weight: 600;
		}
		.sw-lw { color: #ffffff; }
		.sw-lb { color: #000000; }
		.sw-meta {
			font-family: "SF Mono", Consolas, monospace;
			font-size: 11.5px;
			margin-top: 5px;
			line-height: 1.45;
			word-break: break-all;
		}
		.sw-rule { font-family: inherit; font-size: 11.5px; font-weight: 700; }

		/* ---------- 文字 / 边框样张（考 remapText / remapBorder） ---------- */
		.samples { display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 16px; font-weight: 700; }
		.borders { display: flex; flex-wrap: wrap; gap: 10px; }
		.bd { padding: 7px 14px; border-width: 2px; border-style: solid; border-radius: 7px; font-size: 13px; }

		/* ============ 外壳：说明条 / 状态行 / 双栏（始终可读，不参与站点配色） ============ */
		.banner { padding: 20px 24px 22px; background: #7c3aed; color: #fff; border-bottom: 6px solid #3b1d84; }
		.banner-group { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: .85; }
		.banner-case {
			font-size: 40px;
			font-weight: 800;
			letter-spacing: -.5px;
			font-family: "SF Mono", Consolas, monospace;
			word-break: break-all;
			line-height: 1.1;
		}
		.banner-what { font-size: 16px; margin-top: 12px; max-width: 1100px; }
		.banner-expect { font-size: 15px; margin-top: 8px; padding: 8px 12px; background: rgba(0,0,0,.22); border-radius: 8px; max-width: 1100px; }
		.banner-hint {
			font-size: 13.5px;
			margin-top: 10px;
			padding: 7px 11px;
			background: #fde68a;
			color: #713f12;
			border-radius: 6px;
			display: inline-block;
			font-weight: 700;
		}
		.state {
			font-family: "SF Mono", Consolas, monospace;
			font-size: 13px;
			padding: 9px 24px;
			background: #0c0e15;
			color: #8ee6b0;
			border-bottom: 1px solid #2a2f45;
			word-break: break-all;
		}
		.state b { color: #d7e2ff; }
		.state-row + .state-row { margin-top: 3px; }
		.state-row.is-changed { color: #ffd479; }
		.state-row.is-changed b { color: #ffd479; }
		.state-flag { font-weight: 700; }
		.state-reset {
			margin-top: 7px;
			font-family: inherit;
			font-size: 11.5px;
			color: #9fb0c8;
			background: transparent;
			border: 1px solid #2a2f45;
			border-radius: 5px;
			padding: 2px 9px;
			cursor: pointer;
		}
		.state-reset:hover { color: #d7e2ff; border-color: #3b4360; }

		.heads { display: flex; gap: 16px; padding: 10px 16px 0; }
		.head { flex: 1 1 0; min-width: 0; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #6b7280; }
		.panes { display: flex; gap: 16px; padding: 6px 16px 24px; align-items: stretch; min-height: 70vh; }
		.pane { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
		.pane-body { flex: 1 1 auto; min-height: 0; }
		.pane-frame {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
			outline: 2px solid #6b7280;
			outline-offset: -2px;
			background: #fff;
		}
		/* 安全网：滤镜模式下扩展给顶层 html 套 invert+hue-rotate，该滤镜视觉上会一并
		   作用于其后代 iframe，导致「原样」框也被反相；滤镜自逆，给 iframe 再套一份抵消。 */
		html.lon-filtered .pane-frame { filter: invert(100%) hue-rotate(180deg) !important; }
	</style>
</head>
<body>
	<template id="lon-chrome">
		<div class="banner">
			<div class="banner-group">判定组 · remap 模式的调色板</div>
			<div class="banner-case"></div>
			<div class="banner-what"><b>这个 case 在考什么：</b>一整页深色、且没有任何可切的原生主题，逼扩展只能走 <code>remap</code>（逐元素重映射）。页面主体是五组真实世界的颜色样张，每组都带「原色值 / 白字 / 黑字」，右边还标了这个原色<b>是否踩你自己的耐受线</b>。下面还有文字色和边框色的样张。</div>
			<div class="banner-expect"><b>期望：</b>带色相的色块保留原色相、收成浅色块（深色按钮 → 浅底 + 深色字），不再出现「换个色相的艳色块」；中性深色（近黑、slate-900 这类）落到 Solarized 奶油底；文字保留色相但压深到读得清；边框重画成看得见的一条线。</div>
			<div class="banner-hint">左边框是「原样」（扩展不处理 iframe）；右边是扩展处理后的真实效果。两边是同一份样张。</div>
		</div>
		<div class="state">
			<div id="lon-state"></div>
			<button type="button" class="state-reset" id="lon-reset">重新加载本页</button>
		</div>
		<div class="heads">
			<div class="head">原样 —— 扩展不处理这一栏</div>
			<div class="head">扩展处理后 —— 就是扩展实际做的效果</div>
		</div>
		<div class="panes">
			<div class="pane">
				<div class="pane-body">
					<iframe class="pane-frame" src="?raw=1" title="本 case 的原始状态（?raw=1）。扩展不处理 iframe，这里就是真正的「原样」。"></iframe>
				</div>
			</div>
			<div class="pane">
				<div class="pane-body">
					<div class="wrap" id="lon-scene"></div>
				</div>
			</div>
		</div>
	</template>

	<script>
		(function () {
			var raw = new URLSearchParams(location.search).get('raw') === '1';

			/* ================================================================
			   样张数据：五组色块 + 文字色 + 边框色。
			   rule 一栏由本页自己算（不复用扩展的代码）——独立按用户的耐受规则判，
			   免得「扩展说它合规」自证。
			   ================================================================ */
			var GROUPS = [
				{
					title: '① 高饱和品牌色（Tailwind 500/600 —— 现实里最常见的强调色）',
					note: '这一组是重点：#a855f7 / #3b82f6 / #ef4444 这类相对亮度只有 0.21~0.24，看着像「已经够深」，其实是中调。旧实现按亮度放行会把它们原样留在浅底上。',
					colors: ['#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e',
						'#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1',
						'#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e']
				},
				{
					title: '② 深饱和（Tailwind 700/900 —— 深色按钮、卡片、侧栏）',
					note: '期望变成浅色底 + 深色字，而不是变成另一种颜色的饱和块。',
					colors: ['#b91c1c', '#c2410c', '#a16207', '#15803d', '#0f766e', '#1d4ed8',
						'#4338ca', '#6d28d9', '#7e22ce', '#a21caf', '#be185d', '#be123c',
						'#312e81', '#064e3b']
				},
				{
					title: '③ 浅色但高饱和（这次特意堵的口子）',
					note: '浅色不等于不刺眼。#fde047 这类亮度很高但 C*≥44 且 S≥0.70，按规则照样要收。',
					colors: ['#fde047', '#bef264', '#67e8f9', '#fca5a5', '#f0abfc']
				},
				{
					title: '④ 常见深色主题底（中性 —— 应该落到奶油梯级，而不是被调成别的颜色）',
					note: '这些底色的 C* 都在 20 以下（没有色相可言），所以不参与调色，走一条奶油梯级。' +
						'<b>预期结果：右边它们按原来的暗度落在一级一级的奶油色上——越暗的越接近奶油底</b>' +
						'（#0c0c0c 最浅，越往下越深），所以这 10 个能分出好几档，而不是全变成一个颜色。' +
						'带色相的 #1e1b4b 走调色那一路，被收成淡靛紫。',
					colors: ['#0c0c0c', '#1e1e1e', '#2d2d2d', '#0f172a', '#111827', '#0d1117',
						'#2f3136', '#1a1a2e', '#1e1b4b', '#21252b']
				},
				{
					title: '⑤ 旧实现出过问题的原色（回归样本）',
					note: '旧实现里 #00c853 / #ff8c00 / #00bcd4 因为亮度 ≥ 0.4 被整块放行（原样留在页面上）；#ff0000 / #2962ff / #9400d3 则被换成了固定的 Solarized 强调色（色相都变了）。',
					colors: ['#ff0000', '#00c853', '#2962ff', '#ff8c00', '#9400d3', '#00bcd4', '#ffd700', '#e91e63']
				}
			];

			var TEXT_SAMPLES = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6',
				'#8b5cf6', '#a855f7', '#ec4899', '#4a9eff', '#ffd700', '#00c853'];

			var BORDER_SAMPLES = ['#0a0a14', '#e8e8f0', '#a855f7', '#22c55e', '#2a2a44', '#b91c1c'];

			/* ---------- 独立实现用户的耐受规则：CIELAB 的 L*、C* 加 HSV 的 S ---------- */
			function parseHex(h) {
				return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
			}
			function toLab(rgb) {
				function lin(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
				var R = lin(rgb[0]), G = lin(rgb[1]), B = lin(rgb[2]);
				var X = R * 0.4124564 + G * 0.3575761 + B * 0.1804375;
				var Y = R * 0.2126729 + G * 0.7151522 + B * 0.0721750;
				var Z = R * 0.0193339 + G * 0.1191920 + B * 0.9503041;
				function f(t) { return t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116; }
				var fx = f(X / 0.95047), fy = f(Y), fz = f(Z / 1.08883);
				return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
			}
			function hsvS(rgb) {
				var r = rgb[0] / 255, g = rgb[1] / 255, b = rgb[2] / 255;
				var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
				return mx === 0 ? 0 : (mx - mn) / mx;
			}
			/* 用户的耐受规则：整色避开 = L* < 31，或 C* >= 44 且 S(HSV) >= 0.70。
			   已知误伤：黄/橙/橄榄色相（LAB 色相 ~39–80）他其实留了。 */
			function ruleOf(hex) {
				var rgb = parseHex(hex), lab = toLab(rgb);
				var L = lab[0], C = Math.hypot(lab[1], lab[2]), S = hsvS(rgb);
				var dark = L < 31, loud = C >= 44 && S >= 0.70;
				return {
					L: L, C: C, S: S,
					verdict: dark ? '踩线（太深）' : loud ? '踩线（高饱和）' : '过',
					ok: !dark && !loud
				};
			}

			function swatch(hex) {
				var r = ruleOf(hex);
				var verdict = r.ok ? '过 · 合规' : (r.L < 31 ? '踩线 · 太深' : '踩线 · 高饱和');
				return '<div class="sw">' +
					'<div class="sw-box" style="background:' + hex + '">' +
					'<span class="sw-lw">白字 Aa 123</span><span class="sw-lb">黑字 Aa 123</span>' +
					'</div>' +
					'<div class="sw-meta">' + hex + '<br>' +
					'L*' + r.L.toFixed(0) + '  C*' + r.C.toFixed(0) + '  S' + r.S.toFixed(2) + '<br>' +
					'<span class="sw-rule">' + verdict + '</span>' +
					'</div>' +
					'</div>';
			}

			/* 场景本体：raw 模式与右侧栏用的是同一份字符串，保证两边样张完全一致。
			   SW_INDEX 记下每个原色在 .sw-box 里的下标——扩展会用 setProperty 重写 inline style，
			   背景简写会被展开成 longhand，事后没法再从 style 字符串里反查原色，只能靠生成顺序。 */
			var SW_INDEX = {};
			var SCENE = (function () {
				var h = '', n = 0;
				for (var i = 0; i < GROUPS.length; i++) {
					var g = GROUPS[i];
					h += '<div class="card group"><h3>' + g.title + '</h3>' +
						'<p class="legend">' + g.note + '</p><div class="grid">';
					for (var j = 0; j < g.colors.length; j++) {
						if (SW_INDEX[g.colors[j]] === undefined) SW_INDEX[g.colors[j]] = n;
						n++;
						h += swatch(g.colors[j]);
					}
					h += '</div></div>';
				}
				h += '<div class="card group"><h3>⑥ 文字色（考 remapText）</h3>' +
					'<p class="legend">这一排是彩色文字，压在本页的深底上。期望：保留色相但压深，而不是被换成固定的 8 个 Solarized 强调色。' +
					'注意 #ef4444 / #f97316 / #eab308 / #a855f7 这几个——旧实现按「相对亮度 &lt; 0.25 就算够深」早退会把它们漏掉。</p>' +
					'<div class="samples">';
				for (var k = 0; k < TEXT_SAMPLES.length; k++) {
					h += '<span style="color:' + TEXT_SAMPLES[k] + '">' + TEXT_SAMPLES[k] + ' AaGg</span>';
				}
				h += '</div></div>' +
					'<div class="card group"><h3>⑦ 边框色（考 remapBorder）</h3>' +
					'<p class="legend">期望：深色/高饱和的边框重画成同色相、在浅底上看得见的一条线，而不是被换成固定强调色或直接看不见。' +
					'#22c55e 那一格是特意放的——它是中调（亮度 0.41）高饱和，「中调就放行」的写法会漏掉它。</p>' +
					'<div class="borders">';
				for (var m = 0; m < BORDER_SAMPLES.length; m++) {
					h += '<div class="bd" style="border-color:' + BORDER_SAMPLES[m] + '">' + BORDER_SAMPLES[m] + '</div>';
				}
				h += '</div></div>';
				return h;
			})();

			/* 自检用的探针：声明色 → 当前实际算出来的颜色，直接告诉你 remap 有没有生效。 */
			var PROBES = ['#ef4444', '#a855f7', '#0f172a', '#00c853'];

			document.title = LON_CASE + ' · 颠倒黑白 缺陷复现';

			/* raw 模式：只渲染场景本身，不带说明条、不带 iframe。 */
			if (raw) {
				document.body.insertAdjacentHTML('beforeend', '<div class="wrap">' + SCENE + '</div>');
				return;
			}

			/* 默认模式：说明条 + 左右并排（左 iframe 原样 / 右 本页场景）。 */
			document.body.appendChild(document.getElementById('lon-chrome').content.cloneNode(true));
			document.querySelector('.banner-case').textContent = LON_CASE;
			document.getElementById('lon-scene').innerHTML = SCENE;

			/* 自检探针：拿几个已知原色，比对「声明的颜色」和「现在算出来的颜色」，
			   对不上就说明 remap 生效了。这页没有 html.class / data-theme 可看（本来就没有可切的东西），
			   所以直接拿色块本身当状态指示——比看说明文字可靠。 */
			var PROBES = ['#ef4444', '#22c55e', '#3b82f6', '#a855f7', '#eab308', '#0f172a'];
			function rgbOfHex(hex) { return 'rgb(' + parseHex(hex).join(', ') + ')'; }
			function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

			function renderState() {
				var boxes = document.querySelectorAll('#lon-scene .sw-box');
				var changed = false, rows = '';
				for (var p = 0; p < PROBES.length; p++) {
					var idx = SW_INDEX[PROBES[p]];
					if (idx === undefined || !boxes[idx]) continue;
					var declared = rgbOfHex(PROBES[p]);
					var got = getComputedStyle(boxes[idx]).backgroundColor;
					var same = got === declared;
					if (!same) changed = true;
					rows += '<div class="state-row' + (same ? '' : ' is-changed') + '">' +
						'<b>' + esc(PROBES[p]) + '</b> 声明 ' + esc(declared) + ' → 现在 ' + esc(got) +
						(same ? '' : ' <span class="state-flag">· 已变化</span>') +
						'</div>';
				}
				rows += '<div class="state-row">' +
					(changed
						? 'remap <b>已生效</b>（上面几块的颜色被改过了）'
						: 'remap <b>没生效</b> —— 颜色和声明的完全一样。去 popup 看「本站模式 / 实际生效」；' +
						  '本站大概率在 <code>sites</code> 里有一条旧覆盖值（比如「关闭」）压着全局设置。') +
					'</div>';
				document.getElementById('lon-state').innerHTML = rows;
			}
			renderState();

			document.getElementById('lon-reset').addEventListener('click', function () { location.reload(); });

			/* 滤镜安全网：顶层 html 一旦被扩展套上滤镜，就给 iframe 补一份反向滤镜。 */
			function syncFilterGuard() {
				var f = getComputedStyle(document.documentElement).filter;
				document.documentElement.classList.toggle('lon-filtered', !!f && f !== 'none');
			}
			function tick() { renderState(); syncFilterGuard(); }
			tick();
			setInterval(tick, 250);
		})();
	</script>
</body>
</html>
