<!-- Light or Night / 颠倒黑白 —— 图标源。改形状只改这里，然后跑 node tools/make-icons.cjs 重导出 PNG。
     黑白太极：外圆 r44；S 形分界＝两个 r22 的半圆；两只"眼"在 (50,50∓22)，半径 10，
     每只眼的颜色＝对面那半的颜色（黑半里是白点、白半里是黑点）——涂成"自己那半的颜色"就会隐身。
     眼睛半径 10，比经典比例（R/5≈8.8）略大：实测 r9 在 16px 下眼心会从纯黑软成 #292929 的灰块，r10 仍是实心，所以停在这里。再往上加（试过 12.5）看起来就偏卡通、不像标准太极了。
     外面那圈 #6b7280 细线是**必需**的，不是装饰：纯黑压在深色工具栏、纯白压在浅色工具栏上都会
     融进背景，有线托着轮廓才在两种底色下都成立。线画在最外层，所以黑半的边缘也有线。
     线宽 4（viewBox 单位）≈ 16px 下 0.64px，再细就看不见了；要调粗细改 stroke-width 重跑。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="44" fill="#ffffff"/>
  <path d="M50 6 A22 22 0 0 1 50 50 A22 22 0 0 0 50 94 A44 44 0 0 1 50 6 Z" fill="#000000"/>
  <circle cx="50" cy="28" r="10" fill="#ffffff"/>
  <circle cx="50" cy="72" r="10" fill="#000000"/>
  <circle cx="50" cy="50" r="46" fill="none" stroke="#6b7280" stroke-width="4"/>
</svg>
